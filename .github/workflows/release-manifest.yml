name: Release manifest
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update version.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node -e 'const fs=require("fs");const tag=process.env.TAG;fs.writeFileSync("version.json",JSON.stringify({version:tag,release_url:`https://github.com/${process.env.REPOSITORY}/releases/tag/${encodeURIComponent(tag)}`},null,2)+"\n")'
          git add version.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish manifest for $TAG" || exit 0
          git push origin HEAD:main
